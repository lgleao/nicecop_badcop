<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>oiiiii</title>
    <style>
        /* Ajustes gerais de reset e layout da tela */
        body {
            margin: 0; /* Remove as margens brancas padrão do navegador */
            display: flex;
            flex-direction: column;
            min-height: 100vh; /* Ocupa 100% da altura da tela do celular */
            align-items: center;
            justify-content: space-between; /* Empurra a barra pro topo e pro rodapé */
            background-color: rgb(251, 251, 251);
            color: rgb(0, 0, 0);
            text-align: center; /* Centraliza textos em telas pequenas */
        }

        /* Container para manter o conteúdo no meio da tela */
        .conteudo {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            width: 90%;
            max-width: 600px;
        }

        /* O clamp(min, ideal, max) adapta a fonte automaticamente para mobile e desktop */
        h1 {
            font: bolder clamp(40px, 8vw, 140px) Arial;
            margin-bottom: 10px;
        }

        p {
            font: italic clamp(20px, 5vw, 80px) Arial;
            margin: 10px 0;
        }

        .caixa-destaque {
            background-color: rgb(48, 45, 45);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.949);
            font: bold clamp(18px, 4vw, 70px) Arial; 
            margin: 20px 0;
            padding: 15px 20px;
            border-radius: 12px; /* Deixa as bordas arredondadas e mais modernas */
            width: 100%;
            box-sizing: border-box;
        }

        button {
            margin: 15px;
            padding: 15px 30px;
            background-color: rgb(50, 51, 48);
            color: rgb(60, 130, 255); /* Clareei levemente o azul para leitura em fundo escuro */
            font: bolder clamp(16px, 4vw, 50px) Arial;
            border: none; /* Remove a borda padrão do botão */
            border-radius: 10px;
            cursor: pointer;
        }

        .barra-topo, .barra-rodape {
            width: 100%;
            height: 50px;
            background-color: rgb(0, 56, 184);
        }
    </style>
</head>
<body>
    <div class="barra-topo"></div>
    
    <!-- Agrupei o texto em uma div para que as barras fiquem fixas nas extremidades -->
    <div class="conteudo">
        <h1>Olá, amigo(a)!</h1>
        <p>Quer ver algo interessante?</p>
        <div class="caixa-destaque">Vai se impressionar...</div>
        <button id="next_page"> Clique pra aqui pra entender</button>
    </div>

    <div class="barra-rodape"></div>

    <script>
        const botao = document.getElementById("next_page");
        botao.addEventListener('click', () => {
            window.location.href = 'ip.html';
        });
    </script>
</body>
</html>
